name: Auto Ayat Alkitab Reels Bot

on:
  schedule:
    - cron: '30 9 * * *' # Berjalan otomatis pukul 16:30 WIB setiap hari
  workflow_dispatch: # Memunculkan tombol "Run workflow" untuk eksekusi manual

# Memberikan izin kepada bot untuk menulis/mengubah file history di repositori
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mesin Grafis & Video (ImageMagick & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts moviepy requests google-api-python-client google-auth-oauthlib google-auth-httplib2 groq pillow

      - name: Eksekusi Bot Produksi
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python bot.py

      - name: Simpan Memori Bot (Anti-Duplikasi)
        run: |
          git config --global user.name 'Bot Editor AI'
          git config --global user.email 'bot@actions.github.com'
          
          touch history_verses.txt
          
          git add history_verses.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "update memori ayat alkitab"
          git push
