name: Auto Bible Reels Bot

on:
  schedule:
    # Berjalan otomatis dua kali sehari: Pukul 05:00 WITA (21:00 UTC) dan 17:00 WITA (09:00 UTC)
    - cron: '0 21,9 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-bible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          # Menambahkan beautifulsoup4 ke dalam daftar instalasi pip
          pip install moviepy requests pillow edge-tts groq beautifulsoup4

      - name: Jalankan Bot Firman Tuhan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python bot.py

      - name: Simpan Memori Bot (Anti-Duplikasi)
        run: |
          git config --global user.name 'Bot Editor AI'
          git config --global user.email 'bot@actions.github.com'
          
          touch history_verses.txt
          
          git add history_verses.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "update memori ayat alkitab"
          git push
